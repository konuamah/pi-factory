schema_version = "1.4"

artifacts = [
  { source = "/app/.factory/runs", destination = "factory-runs" },
]

[task]
name = "local/factory-bombsite-05-repair-verification"
version = "1.0.0"
description = "Personalize the contact-form success message while a seeded verification check fails until the change is made; the run must recover via repair honoring interview constraints. Oracle validates; agent trials score Factory orchestration."
[[task.authors]]
name = "Kelvi"
keywords = ["factory", "harbor", "benchmark", "html", "javascript", "interview", "repair"]

[metadata]
family = "repair-following-failed-verification"
stressSite = "bombsite"
pillarFocus = ["interviewQuality", "handoffQuality", "executionQuality"]
interviewRequired = true
networkPolicy = "public"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
network_mode = "public"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
