# Project config for the Harbor benchmark fixture.
# The lint command here is STALE on purpose: it points at tools/lint.mjs, which
# does not exist in this repo. The task measures verification adaptation — the
# agent must notice the configured lint is broken and adapt (replace it with an
# evidence-backed command, or omit it), never blindly run it or invent a
# replacement that is not grounded in the repo.
project:
  baseBranch: main

commands:
  lint: node tools/lint.mjs
  test: node tests/verify-page.mjs && node tests/verify-local-form.mjs

runtime:
  maxParallelAgents: 1
  limits:
    totalRunTimeoutMs: 600000
    modelTimeoutMs: 90000

approval:
  finalMerge: required

# This fixture runs in a local container with no git remote and no gh CLI.
# Disable the pull-request recovery fallback so a blocked direct landing fails
# loudly with the candidate preserved instead of trying (and failing) to push
# to a non-existent remote.
git:
  pullRequest:
    enabled: false

# Scope handoff: plan-declared non-goal files are checked in verification
# (SCOPE requirement) and at the landing guard. Defaults are warn (non-blocking)
# so the benchmark measures detection accuracy before any trial fails on it.
scope:
  verification: warn
  landing: warn
