schema_version = "1.4"

artifacts = [
  { source = "/app/.factory/runs", destination = "factory-runs" },
]

[task]
name = "local/factory-bombsite-02-status-surface"
version = "1.0.0"
description = "Add a status surface to the doctor portfolio page; the interview decides its content and the implementation must match those decisions. Oracle validates; agent trials score Factory orchestration."
[[task.authors]]
name = "Kelvi"
keywords = ["factory", "harbor", "benchmark", "html", "javascript", "interview", "handoff"]

[metadata]
family = "status-surface"
stressSite = "bombsite"
pillarFocus = ["interviewQuality", "handoffQuality", "scopeQuality"]
interviewRequired = true
networkPolicy = "public"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
network_mode = "public"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
